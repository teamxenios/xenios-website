name: Owned pure image-view reuse controls
on:
  push:
    branches:
      - codex/ea-release-image-reuse-owned-20261121
permissions:
  contents: read
concurrency:
  group: owned-image-view-reuse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
