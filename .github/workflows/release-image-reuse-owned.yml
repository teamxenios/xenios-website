           need(JSON.stringify(txt(event,'diff','--no-renames','--name-status',BASE,S).split('\n').sort())===JSON.stringify(PATHS.map(p=>'A\t'+p).sort())&&txt(event,'diff','--no-renames','--name-status',S,R)==='A\t'+LEAF);
           const pins=[];for(let i=0;i<PATHS.length;i++){const p=PATHS[i],line=txt(event,'ls-tree',S,'--',p),m=/^100644 blob ([a-f0-9]{40})\t(.+)$/.exec(line);need(m&&m[2]===p);const raw=git(event,'cat-file','blob',m[1]);need(sha(raw)===hashes[i]&&boundedRead(path.join(source,...p.split('/'))).equals(raw));pins.push({path:p,mode:'100644',blob:m[1],bytes:raw.length,sha256:hashes[i]});}
           const workflow=git(event,'show',R+':'+LEAF),runnerTree=txt(event,'rev-parse',R+'^{tree}');
           return {source,names,public:{kind:'OWNED_REUSE_SOURCE_PROOF',source:S,sourceTree:T,runner:R,runnerTree,base:BASE,baseTree:BASE_TREE,sourceSoleParent:BASE,runnerSoleParent:S,pins,workflowPath:LEAF,workflowSha256:sha(workflow),run,attempt:1,node:process.versions.node,platform:process.platform,expectedCount:names.length,expectedNames:names,scope:'PURE_FIXED_FIXTURE_CONTROL_ONLY_NO_RELEASE_OR_VIEW_AUTHORITY'}};
