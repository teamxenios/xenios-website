           const inventoryRaw=Buffer.from(b64,'base64');need(inventoryRaw.toString('base64')===b64);const names=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(inventoryRaw));
           need(Array.isArray(names)&&names.length===Number(n)&&new Set(names).size===names.length&&names.every(x=>typeof x==='string'&&x.length>=1&&x.length<=180&&/^[\x20-\x7e]+$/.test(x)&&x===x.trim()&&!/[#\\]/.test(x)));
           const workspace=fs.realpathSync.native(process.env.GITHUB_WORKSPACE),source=fs.realpathSync.native(path.join(workspace,'reuse-source')),event=fs.realpathSync.native(path.join(workspace,'reuse-event'));
           const e=JSON.parse(boundedRead(process.env.GITHUB_EVENT_PATH));need(e.created===true&&e.forced===false&&e.deleted===false&&e.before==='0'.repeat(40)&&e.after===R&&e.ref===BRANCH&&e.repository?.full_name==='teamxenios/xenios-website');
           need(txt(source,'rev-parse','HEAD')===S&&txt(event,'rev-parse','HEAD')===R&&txt(event,'show','-s','--format=%P',R)===S&&txt(event,'show','-s','--format=%P',S)===BASE);
