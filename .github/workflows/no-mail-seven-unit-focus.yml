          reports = []
          for suffix, version in [('6', '17.6'), ('11', '17.11')]:
              path = Path(os.environ['RUNNER_TEMP']) / f'no-mail-operator-pg17-{suffix}.json'
              raw = path.read_bytes()
              result = json.loads(raw)
              assert result['success'] is True
              assert result['numTotalTests'] == 35 and result['numPassedTests'] == 35
              assert result['numFailedTests'] == 0 and result['numPendingTests'] == 0
              assert result.get('numTodoTests', 0) == 0
              assert len(result['testResults']) == 4
              assert collections.Counter(Path(x['name']).name for x in result['testResults']) == collections.Counter(expected.keys())
              files = []
              for item in result['testResults']:
                  name = Path(item['name']).name
                  cases = item['assertionResults']
                  assert item['status'] == 'passed'
                  assert collections.Counter(case['title'] for case in cases) == collections.Counter(expected[name])
                  assert all(case['status'] == 'passed' for case in cases)
                  files.append({'name': name, 'actualPassed': len(cases), 'exactCaseTitles': [case['title'] for case in cases]})
              assert sum(file['actualPassed'] for file in files) == 35
              reports.append({'declaredOwnedProfile': version, 'files': files,
                              'actualPassed': 35, 'failed': 0, 'pending': 0,
                              'rawReportSha256': hashlib.sha256(raw).hexdigest()})
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
          summary = {'state': 'OWNED_OPERATOR_MECHANICS_ONLY',
                     'source': os.environ['EXPECTED_SOURCE'], 'sourceTree': os.environ['EXPECTED_SOURCE_TREE'],
                     'runner': os.environ['GITHUB_SHA'], 'executedProfiles': reports,
                     'uniqueAuthoredCases': 35, 'repeatedPerProfile': 35, 'totalCaseExecutions': 70,
                     'repeatNotice': 'The same35 cases (old9pure+10PG,new10FS+6PG) repeat in each profile;70 executions are NOT70 unique cases.',
                     'ownedFullSevenUnitRequiredCaseTitles': ["ownedTLS17 full7: new native factory and durable journals commit exact UNARMED catalog and conserve ordinary rows", "ownedTLS17 full7: actual committed transaction with withheld ACK stays unknown, independently observed and never replayed", "ownedTLS17 full7: real final-file exclusion failure preserves installed UNARMED state and missing journal uncertainty"],
                     'ownedFullSevenUnitCasesPassedInEachProfile': True,
