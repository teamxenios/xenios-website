                     'borrowed8893Pass': False}
          (Path(os.environ['RUNNER_TEMP']) / 'no-mail-operator-reconciliation.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary))
          PY
      - name: Preserve only the owned synthetic result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-mail-operator-r2-owned-results
          path: ${{ runner.temp }}/no-mail-operator-*.json
          if-no-files-found: warn
          retention-days: 7
