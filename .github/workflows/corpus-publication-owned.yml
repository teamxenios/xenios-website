name: Owned Windows corpus publication fixture qualification
on:
  push:
    branches:
      - codex/ea-corpus-publication-mock-scope-owned-20261121
permissions:
  contents: read
concurrency:
  group: owned-corpus-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.repository == 'teamxenios/xenios-website' &&
      github.event_name == 'push' && github.run_attempt == '1' &&
      github.event.created == true && github.event.forced == false &&
      github.ref == 'refs/heads/codex/ea-corpus-publication-mock-scope-owned-20261121'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact immutable event R for graph proof
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ github.sha }}
          path: publication-event
          fetch-depth: 3
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Checkout exact immutable source S to execute
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: 'c14a6727fd336347696314ea4c9d6f28cac7b170'
          path: publication-source
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Pinned Node runtime only
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
          architecture: x64
          check-latest: false
      - name: Source guard and one native23 Windows fixture qualification
        id: capture
        shell: pwsh
        timeout-minutes: 12
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          XR_PUBLICATION_INPUT_SOURCE: 'c14a6727fd336347696314ea4c9d6f28cac7b170'
          XR_PUBLICATION_INPUT_TREE: '8919a59cddd77b7bd54a84687be38ec6733b818f'
          XR_PUBLICATION_CONTROLLER_SHA256: '79c735dad64adf97cb6b71e661ead502301875a0a227b4aa767635cf2dbbc5e8'
          XR_RUNNER_LABEL: windows-2022
          XR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeBinary = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          if (-not $nodeBinary) { throw 'PINNED_NODE_NOT_FOUND' }
          $controllerPath = Join-Path $env:GITHUB_WORKSPACE 'publication-event/scripts/qualification/corpus-publication-owned/capture-owned-qualification.mjs'
          & $nodeBinary $controllerPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only this invocation-owned bounded fixture JSON reports
        if: ${{ always() && steps.capture.outputs.report_owned == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-corpus-publication-windows-2022-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.capture.outputs.report_dir }}/input-provenance.json
            ${{ steps.capture.outputs.report_dir }}/qualification-report.json
            ${{ steps.capture.outputs.report_dir }}/node-events.json
            ${{ steps.capture.outputs.report_dir }}/node-stderr.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
