name: qa release gates

on:
  pull_request:
  workflow_dispatch:

jobs:
  route-security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run qa:routes:check
      - run: npm run qa:ui
      - run: npm run qa:leaks
      - run: node script/qa-migration-verify.mjs --static

  build-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run qa:performance
      - run: npm run qa:leaks

  disposable-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run qa:migrations

  browser-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-6-playwright-evidence
          path: |
            playwright-report
            test-results/playwright
          retention-days: 14

