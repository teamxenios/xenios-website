name: PR385 synthetic WebKit guest capture
on:
  push:
    branches: [codex/qo-pr385-webkit-20261104]
    paths:
      - .github/workflows/qo-visual-capture.yml
      - scripts/qa/qo-visual-capture/**
permissions:
  contents: read
jobs:
  capture:
    # Preparation commits skip the browser job. This marker is not approval:
    # Root must reconcile actual runs and bind Samuel's new Jira allowance first.
    if: >-
      github.repository == 'teamxenios/xenios-website' &&
      github.ref == 'refs/heads/codex/qo-pr385-webkit-20261104' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'QO capture ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 329c18e0ad7c01a0a784fa9bc3df9ebda100bbf6
      CANDIDATE_TREE: 06c964210492f3814edf42aec2da80b6a11f71cd
      # Dormant until the existing Root binds a new approval and run reconciliation.
      CAPTURE_ALLOWANCE_ID: UNBOUND
      CAPTURE_ALLOWANCE_ATTEMPT: "1"
      CAPTURE_ALLOWANCE_MAX_ATTEMPTS: "1"
      CAPTURE_PRIOR_RUN_IDS: '[]'
      CAPTURE_RECONCILED_AT: UNBOUND
      CAPTURE_DIAGNOSIS: ""
    steps:
      - name: Set disposable tool and evidence directories
        shell: bash
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/qo-webkit\nEVIDENCE_DIR=%s/qo-visual-evidence\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Require an explicitly bound allowance and deliberate dispatch
        shell: bash
        env:
          DISPATCH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          const e = process.env;
          const id = e.CAPTURE_ALLOWANCE_ID;
          if (!/^[0-9a-f]{40}$/.test(e.CANDIDATE_SHA) || !/^[0-9a-f]{40}$/.test(e.CANDIDATE_TREE)) {
            throw new Error("Exact candidate commit and tree must be bound before capture");
          }
          const attempt = Number(e.CAPTURE_ALLOWANCE_ATTEMPT);
          const maximumAttempts = Number(e.CAPTURE_ALLOWANCE_MAX_ATTEMPTS);
          const priorRunIds = JSON.parse(e.CAPTURE_PRIOR_RUN_IDS);
          if (!/^KAN-31\/\d+$/.test(id) || ["KAN-31/10563", "KAN-31/10573", "KAN-31/10645", "KAN-31/10684"].includes(id)) throw new Error("A new, explicit Jira allowance is required");
          if (maximumAttempts !== 1 || attempt !== 1 || e.GITHUB_RUN_ATTEMPT !== "1") throw new Error("Invalid allowance ordinal or rerun");
          if (!Array.isArray(priorRunIds) || priorRunIds.length !== attempt - 1 ||
              priorRunIds.some((v) => typeof v !== "string" || !/^\d+$/.test(v)) ||
              new Set(priorRunIds).size !== priorRunIds.length || priorRunIds.includes(e.GITHUB_RUN_ID)) throw new Error("Reconciled distinct run IDs are required");
          if (!/^\d{4}-\d{2}-\d{2}T.*Z$/.test(e.CAPTURE_RECONCILED_AT) || !Number.isFinite(Date.parse(e.CAPTURE_RECONCILED_AT))) throw new Error("Root must record pre-dispatch reconciliation");
          if (e.DISPATCH_MESSAGE.trim() !== "QO capture " + id + " attempt " + attempt) throw new Error("Push is not the exact deliberate capture dispatch");
          const allowance = {
            id, attempt, maximumAttempts, consumedIncludingThisRun: attempt,
            remainingAfterThisRun: maximumAttempts - attempt,
            priorRunIds, currentRunId: e.GITHUB_RUN_ID,
            distinctRunIds: [...priorRunIds, e.GITHUB_RUN_ID],
            reconciledAt: e.CAPTURE_RECONCILED_AT,
            diagnosis: e.CAPTURE_DIAGNOSIS || null,
            accounting: "Existing Root reconciled hosted run IDs before this deliberate push; not GitHub run_attempt",
          };
          writeFileSync(join(e.EVIDENCE_DIR, "allowance.json"), JSON.stringify(allowance, null, 2) + "\n");
          NODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
      - name: Install locked tools and build the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v20.19.0
          test "$(npm --version)" = 10.8.2
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          (
            cd harness/scripts/qa/qo-visual-capture
            npm ci --no-audit --no-fund
            ./node_modules/.bin/playwright install --with-deps webkit
          )
          cd candidate
          env -i PATH="$PATH" HOME="$HOME" CI=true \
            node scripts/evidence/build-candidate-preview.mjs --sha "$CANDIDATE_SHA"
      - name: Capture the sequential synthetic viewport matrix inside a loopback-only namespace
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          sudo unshare --net bash -euc '
            ip link set lo up
            exec runuser -u "$1" -- env -i HOME="$2" PATH="$3" \
              PLAYWRIGHT_BROWSERS_PATH="$4" \
              "$5" --import "$6/node_modules/tsx/dist/loader.mjs" \
              "$7/scripts/qa/qo-visual-capture/capture.mjs" "$6" "$8" "$9" \
              "${10}" "${11}" "${12}" "${13}" "${14}" "${15}"
          ' bash "$(id -un)" "$HOME" "$PATH" "$PLAYWRIGHT_BROWSERS_PATH" \
            "$(command -v node)" "$PWD/candidate" "$PWD/harness" "$EVIDENCE_DIR" \
            "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$EVIDENCE_DIR/allowance.json" guest-mobile-webkit
      - name: Preserve a result if setup stopped before capture
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          if [ ! -s "$EVIDENCE_DIR/result.json" ]; then
            node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const e = process.env, allowancePath = join(e.EVIDENCE_DIR, "allowance.json");
          const result = {
            scope: "NON-PRODUCTION SYNTHETIC BROWSER EVIDENCE",
            candidateSha: e.CANDIDATE_SHA, candidateTree: e.CANDIDATE_TREE, harnessRevision: e.GITHUB_SHA,
            runId: e.GITHUB_RUN_ID, runAttempt: Number(e.GITHUB_RUN_ATTEMPT),
            allowance: existsSync(allowancePath) ? JSON.parse(readFileSync(allowancePath, "utf8")) : null,
            status: "setup or allowance gate failed before capture", captures: [],
          };
          writeFileSync(join(e.EVIDENCE_DIR, "result.json"), JSON.stringify(result, null, 2) + "\n");
          NODE
          fi
      - name: Require the exact mobile capture manifest and PNGs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          const e = process.env;
          const devices = new Map([[375, "iPhone SE"], [390, "iPhone 13"], [430, "iPhone 13 large viewport"]]);
          const widths = [...devices.keys()];
          const pngs = (width) => ["catalog", "details"].map((name) => "guest-mobile-" + width + "-" + name + ".png");
          const expected = widths.flatMap(pngs).sort();
          const result = JSON.parse(readFileSync(join(e.EVIDENCE_DIR, "result.json"), "utf8"));
          const files = readdirSync(e.EVIDENCE_DIR).filter((name) => name.endsWith(".png")).sort();
          if (result.status !== "passed" || result.profile !== "guest-mobile-webkit" || result.browser?.name !== "WebKit" ||
              result.tooling?.playwright !== "1.64.1" || result.allowance?.id !== e.CAPTURE_ALLOWANCE_ID ||
              result.allowance?.maximumAttempts !== 1 || result.allowance?.remainingAfterThisRun !== 0 ||
              result.candidateSha !== e.CANDIDATE_SHA || result.candidateTree !== e.CANDIDATE_TREE ||
              result.harnessRevision !== e.GITHUB_SHA || result.runId !== e.GITHUB_RUN_ID ||
              result.runAttempt !== 1 || !result.network?.loopbackOnly || result.captures?.length !== widths.length ||
              JSON.stringify(files) !== JSON.stringify(expected)) throw new Error("Capture identity or PNG inventory failed");
          for (const width of widths) {
            const entry = result.captures.find((item) => item.name === "guest-mobile-" + width);
            if (entry?.viewport.width !== width || entry.deviceName !== devices.get(width) || !entry.mobile ||
                entry.network?.accepted !== 1 || entry.network.syntheticIntentPosts !== (width === 390 ? 2 : 0) ||
                entry.network.deniedWrites !== 0 || entry.network.deniedRecovery !== 0 || !entry.assertions?.length ||
                entry.assertions.some((item) => item.pass !== true) ||
                JSON.stringify(entry.screenshots) !== JSON.stringify(pngs(width))) {
              throw new Error("Incomplete capture context at " + width);
            }
            for (const name of pngs(width)) {
              const data = readFileSync(join(e.EVIDENCE_DIR, name));
              if (data.length < 33 || data.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a") {
                throw new Error("Missing or invalid PNG " + name);
              }
            }
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qo-pr385-webkit-guest-synthetic-proof
          path: |
            ${{ env.EVIDENCE_DIR }}/guest-mobile-375-catalog.png
            ${{ env.EVIDENCE_DIR }}/guest-mobile-375-details.png
            ${{ env.EVIDENCE_DIR }}/guest-mobile-390-catalog.png
            ${{ env.EVIDENCE_DIR }}/guest-mobile-390-details.png
            ${{ env.EVIDENCE_DIR }}/guest-mobile-430-catalog.png
            ${{ env.EVIDENCE_DIR }}/guest-mobile-430-details.png
            ${{ env.EVIDENCE_DIR }}/result.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: qo-pr385-webkit-guest-failure-manifest
          path: ${{ env.EVIDENCE_DIR }}/result.json
          if-no-files-found: error
          retention-days: 7
