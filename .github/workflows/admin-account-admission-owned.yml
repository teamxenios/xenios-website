          TREE = '4edba31ae4d842b57ed84cff1dbd72e2bc10c713'
          PARENT = '120d3eb46a213d83ba466d7038aa364471ec6fce'
          BASE = '82f5e698dd71eeafddecab21c0c7c4f728057d57'
          BASE_TREE = '8eb20fb57187c388ac2b0916210bb9aa30746ec5'
          LEAF = '.github/workflows/admin-account-admission-owned.yml'
          REF = 'refs/heads/codex/ea-admin-account-admission-owned-20261121'
          PINS = [{'path': 'server/index.ts', 'mode': '100644', 'blob': 'e8b50fbaf66c497f9e90b25be4039edf5fa0ba45', 'bytes': 71908, 'sha256': '244786de27ac4c2d4c090c7ebb993953ea3b1ecc1c0d573cd3875ae6e89aebe3'}, {'path': 'client/src/research/adminx-section.tsx', 'mode': '100644', 'blob': 'cb0d65a27297b45c087e9af93bc97e81aa44a795', 'bytes': 11229, 'sha256': 'e8dd9d5892e4fbdf8861e52b768003189650a846edc6ce1e36472d8dc81bba7d'}, {'path': 'client/src/research/ui/shells.tsx', 'mode': '100644', 'blob': 'a305bd4f58ca15c042739dca114088088841ff7b', 'bytes': 14421, 'sha256': '5d3f5b097c674d63f184bb4d1a9cd65ae4f8f9aa7abd0808a3886d4c9a4c7375'}, {'path': 'server/research/admin-account-admission.ts', 'mode': '100644', 'blob': 'bc65a89e7368c9196a4ca4a22fb84b65ff2aa8c9', 'bytes': 10459, 'sha256': 'd997a597f0287d75a75aa2724234173a6ca67ce79d3d9343c6a0ab9f0ad72a92'}, {'path': 'server/research/admin-account-admission.test.ts', 'mode': '100644', 'blob': 'e6c38f69f283476555af921abc84f1dfc8f2ef9e', 'bytes': 18572, 'sha256': '3af316fe70c75944fd410d512cb7fcba46ba8db2828838e8af3e62e7882ad721'}, {'path': 'supabase/candidates/admin_account_session.sql', 'mode': '100644', 'blob': '8414936dcba34bc5ba854703bb986a091547c2f7', 'bytes': 2127, 'sha256': '8e16f9f3146f59e6c42c29d18315bf35dfe1a0016b2afee343c0b6f195d931e6'}, {'path': 'server/research/admin-account-session.pg.test.ts', 'mode': '100644', 'blob': 'f57c6c29cbb0b8ab5aa2d6243ef95a932a3b48a7', 'bytes': 6372, 'sha256': 'f1824be099a2bca5ce958c1a3698f16e41f901a11f114967fc5500a62df7d41e'}, {'path': 'server/research/admin-account-mount.ts', 'mode': '100644', 'blob': '304b448eefa0b94aad818da26c10e191d6210af3', 'bytes': 6174, 'sha256': '316e1bb985caffbf2cbb47a298df86c844288e2eacd02da452e244f25b491db5'}, {'path': 'server/research/admin-account-mount.test.ts', 'mode': '100644', 'blob': 'b29148462ab9f5caaeea7d961b7f9981ee70b600', 'bytes': 11502, 'sha256': '070d0a110fe839907553d138730d64a0a6cdf9b9b013500b29a8e4091209c786'}, {'path': 'package-lock.json', 'mode': '100644', 'blob': '912f4f85e9a078ed97ed2b67ce8d1de09490eb29', 'bytes': 262653, 'sha256': 'd25eb6b816b616cfa1dc7b1769c14971b944e5385bfae9be41e75d1cf5e64f74'}, {'path': 'package.json', 'mode': '100644', 'blob': '3f2403bca1d033e4be81eaa7c55e6d45eaf1decc', 'bytes': 5643, 'sha256': '5cc063f65b19feab6e5a951fc88e7266f3db32f9d833820c592cd6a7dad9a6f1'}, {'path': 'tsconfig.json', 'mode': '100644', 'blob': 'cb406c8a0f64787c157f1ff61c52f791b4b2a5ae', 'bytes': 752, 'sha256': '5f41f98d5eabcc089474b21db34688585bc16038985663514e5fef780a8a6792'}, {'path': 'vitest.config.ts', 'mode': '100644', 'blob': '242428c09e76d16da672e70e48bb885f90c71026', 'bytes': 1713, 'sha256': '24bdf9b67ddd363895a55879c07c779c5a367c399ea2fef1d17300f32382a5d0'}, {'path': 'script/build.mjs', 'mode': '100644', 'blob': 'a71731b3e52a6f22712329fa63d16693069c8f1b', 'bytes': 662, 'sha256': '56a4f52b19c3dae4d5926f7758c34d73b2db1c1a4c181fae98ca920d3795e149'}, {'path': 'server/research/assisted-order/request-intent/durable-journey.pg.fixture.ts', 'mode': '100644', 'blob': '9ab6e444b9aa58ae0b15449f5a2e3466d6147bb4', 'bytes': 22965, 'sha256': '3889dfbf502614e95f4fd00c6d265d9049a41766fa1cff82e0fd124305db80b4'}, {'path': 'server/research/assisted-order/request-intent/disposable-pg16.fixture.ts', 'mode': '100644', 'blob': '539b1e3adedcd401201e85ad9e0b1ac5ec712df2', 'bytes': 2599, 'sha256': 'c0987989be78af9c0267b1eb3af15c73a46139f7db71885ade1593f830f2fbc3'}, {'path': 'supabase/research-prelaunch-foundation.sql', 'mode': '100644', 'blob': '2e4171fa8dc65115693c5d72f2a974d2f1103691', 'bytes': 7836, 'sha256': 'adbc253aa214b14bfba7708457720913a350556120cf0c8df0aabe807c27dbff'}]
          DELTA = ['M\tclient/src/research/adminx-section.tsx', 'M\tclient/src/research/ui/shells.tsx', 'M\tserver/index.ts', 'A\tserver/research/admin-account-admission.test.ts', 'A\tserver/research/admin-account-admission.ts', 'A\tserver/research/admin-account-mount.test.ts', 'A\tserver/research/admin-account-mount.ts', 'A\tserver/research/admin-account-session.pg.test.ts', 'A\tsupabase/candidates/admin_account_session.sql']
          TESTS = {'server/research/admin-account-admission.test.ts': 37,
                   'server/research/admin-account-mount.test.ts': 24,
                   'server/research/admin-account-session.pg.test.ts': 2}
          root = Path.cwd().resolve(); metadata = root.parent / 'runner-metadata'
          end = time.monotonic() + 720; owner = None; phase = 'source_guard'; calls = 0
          proof = None; commands = []; native = None; problem = None
          sha = lambda raw: hashlib.sha256(raw).hexdigest()
          def need(value, code):
              if not value: raise RuntimeError(code)
          def git(repo, *args):
              global calls
              calls += 1; need(calls <= 100 and time.monotonic() < end - 15, 'GIT_BUDGET')
              value = subprocess.run(['git', '--no-optional-locks', '--no-replace-objects', '--no-lazy-fetch', '-C', str(repo), *args],
                  capture_output=True, timeout=10, env={**child_env, 'GIT_CONFIG_GLOBAL': '/dev/null'})
              need(value.returncode == 0 and not value.stderr and len(value.stdout) <= 2097152, 'GIT_REFUSED')
              return value.stdout
          def owns():
              if owner is None: return False
              try:
                  p, dev, ino = owner; current = p.lstat()
                  return stat.S_ISDIR(current.st_mode) and not p.is_symlink() and p.resolve() == p and (current.st_dev, current.st_ino) == (dev, ino)
              except OSError: return False
          def write(name, value):
              need(owns() and name in {'source-guard.json', 'command-observations.json', 'qualification.json'}, 'OUTPUT_NOT_OWNED')
              raw = (json.dumps(value, indent=2) + '\n').encode(); need(len(raw) <= 524288, 'REPORT_BOUND')
              fd = os.open(owner[0] / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as out:
                  out.write(raw); out.flush(); os.fsync(out.fileno())
          def run(label, argv, seconds):
              need(time.monotonic() < end - 20, 'CAPTURE_DEADLINE')
              deadline = min(time.monotonic() + seconds, end - 15)
              p = subprocess.Popen(argv, cwd=root, env=child_env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              sel = selectors.DefaultSelector(); sel.register(p.stdout, selectors.EVENT_READ, 'out'); sel.register(p.stderr, selectors.EVENT_READ, 'err')
              buffers = {'out': bytearray(), 'err': bytearray()}; counts = {'out': 0, 'err': 0}; timeout = False; overflow = False
              while sel.get_map():
                  if time.monotonic() >= deadline: timeout = True; break
                  for key, _ in sel.select(min(0.1, max(0, deadline - time.monotonic()))):
                      chunk = os.read(key.fd, 65536)
