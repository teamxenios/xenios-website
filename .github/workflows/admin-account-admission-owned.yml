              need(all((root / p['path']).read_bytes() == git(root, 'cat-file', 'blob', p['blob']) for p in PINS), 'PIN_CHANGED_DURING_QUALIFICATION')
          except Exception as error:
              allowed = {'GIT_BUDGET','GIT_REFUSED','CAPTURE_DEADLINE','EVENT_REFUSED','WORKFLOW_IDENTITY','FIRST_PUSH_REFUSED','RUNNER_REFUSED','CHECKOUT_IDENTITY','RUNNER_PARENT','SOURCE_PARENTS','SOURCE_TREE','SOURCE_NINE_DELTA','RUNNER_WORKFLOW_ONLY','SOURCE_DIRTY','PIN_MODE_BLOB','PIN_BYTES','OUTPUT_PARENT','OUTPUT_CREATE','RUNTIME_VERSION','INSTALL_FAILED','LOCKED_RUNTIME_VERSION','PROJECT_TYPECHECK_FAILED','FOCUSED_TYPECHECK_FAILED','APP_BUILD_FAILED','NATIVE_63_NOT_QUALIFIED','NATIVE_REPORT_MISSING_OR_BOUND','NATIVE_MODULE_COUNT','NATIVE_MODULE_IDENTITY','NATIVE_ASSERTIONS_MISSING','NATIVE_TITLE_BOUND','NATIVE_ANCESTRY','NATIVE_FULL_NAME','NATIVE_ANCESTRY_BOUND','NATIVE_DUPLICATE_CASE','NATIVE_STATUS','NATIVE_FAILURE_SHAPE','NATIVE_MODULE_MISSING','NATIVE_COUNTER_SHAPE','SOURCE_CHANGED_DURING_QUALIFICATION','PIN_CHANGED_DURING_QUALIFICATION'}
              problem = str(error) if type(error) is RuntimeError and str(error) in allowed else 'UNEXPECTED_OWNED_QUALIFICATION_FAILURE'
          finally:
              if owns():
                  try:
                      write('command-observations.json', {'commands': commands, 'rawStdoutStderrRetained': False, 'rawNativeReportUploaded': False})
                      write('qualification.json', {'result': 'PASS_EXACT63_OWNED_SYNTHETIC_CASES' if problem is None else 'FAIL_OR_INCOMPLETE',
                          'problem': problem, 'phase': phase, 'source': SOURCE, 'tree': TREE, 'runner': os.environ.get('GITHUB_SHA'),
                          'run': os.environ.get('GITHUB_RUN_ID'), 'attempt': 1, 'versions': locals().get('versions', {}), 'native': native,
                          'scope': 'ROOT_ADMISSION_MOUNT_AND_OWNED_PG17_ONLY_NO_MANAGED_AUTH_ROLE_OR_PROVIDER_ACTIVATION',
                          'cleanup': 'Existing PG fixture owns its finally cleanup. No container enumeration/removal or whole-descendant exit is inferred by this capture.'})
                      need(owns(), 'OUTPUT_NOT_OWNED')
                      allowed = {'source-guard.json','command-observations.json','qualification.json'}
                      files = list(owner[0].iterdir()); need({x.name for x in files} == allowed | {'private'}, 'ARTIFACT_INVENTORY')
                      for p in files:
                          need(not p.is_symlink(), 'ARTIFACT_SYMLINK')
                          if p.name in allowed: need(p.is_file() and 0 < p.stat().st_size <= 524288, 'ARTIFACT_BOUND')
                      need(sum((owner[0] / x).stat().st_size for x in allowed) <= 1048576, 'ARTIFACT_TOTAL_BOUND')
                      with Path(os.environ['GITHUB_OUTPUT']).open('a') as out: out.write('artifact_owned=true\nartifact_dir=' + str(owner[0]) + '\n')
                  except Exception:
                      problem = 'OWNED_REPORT_OR_ARTIFACT_REFUSED'
              print('ADMIN_ACCOUNT_QUALIFICATION_' + ('PASS' if problem is None else 'FAIL') + ' phase=' + phase + ' problem=' + (problem or 'NONE'))
          sys.exit(0 if problem is None else 1)
          PY
      - name: Upload only this step's genuinely owned closed reports
        if: ${{ always() && steps.qualify.outputs.artifact_owned == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 1
        with:
          name: admin-account-admission-0655c703-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.qualify.outputs.artifact_dir }}/source-guard.json
            ${{ steps.qualify.outputs.artifact_dir }}/command-observations.json
            ${{ steps.qualify.outputs.artifact_dir }}/qualification.json
          if-no-files-found: error
          retention-days: 7
