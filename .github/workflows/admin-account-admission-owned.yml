# Private proposal. S2 is the published source; R is a future workflow-only child.
# This workflow cannot install SQL, enable a rollout, or authorize managed reads.
name: Canonical admin account admission owned qualification
on:
  push:
    branches: [codex/ea-admin-account-admission-owned-20261121]
    paths: [.github/workflows/admin-account-admission-owned.yml]
permissions:
  contents: read
concurrency:
  group: admin-account-admission-owned-20261121
  cancel-in-progress: false
jobs:
  owned-admin-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the actual workflow runner R for metadata only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          path: runner-metadata
          fetch-depth: 4
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout only the immutable published source S2 for execution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 2
        with:
          ref: 0655c703f3d90c80879dfda5dde3c84e4011c22f
          path: source
          fetch-depth: 3
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install the pinned owned runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 2
        with:
          node-version: '20.19.0'
          architecture: x64
          check-latest: false
      - name: Guard source and qualify the actual three suites with closed reports
        id: qualify
        timeout-minutes: 13
        working-directory: source
        shell: bash
        env:
          XR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          XR_WORKFLOW_SHA: ${{ github.workflow_sha }}
          NODE_OPTIONS: ''
          NODE_PATH: ''
        run: |
          python3 - <<'PY'
          # Private text mirror of the workflow's inline stdlib capture; never a repository payload.
