                      except ProcessLookupError: pass
                      try: p.wait(timeout=5); closed = True
                      except subprocess.TimeoutExpired: pass
              sel.close(); p.stdout.close(); p.stderr.close()
              diagnostic = []
              for line in bytes(buffers['out'] + buffers['err']).decode('utf-8', errors='replace').splitlines():
