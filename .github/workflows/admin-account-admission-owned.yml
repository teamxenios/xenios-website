                  'assertions': rows, 'problems': sorted(set(reasons)), 'accepted': not reasons}
          
          # Children receive no inherited provider/DB/rollout/credential variables.
          child_env = {k: os.environ[k] for k in ['PATH', 'HOME', 'TMPDIR', 'RUNNER_TEMP', 'LANG', 'LC_ALL'] if k in os.environ}
