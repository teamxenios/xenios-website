              return record, bytes(buffers['out'])
          def good(record): return record['exitCode'] == 0 and record['childClosed'] and not any(record[x] for x in ['timeout', 'overflow', 'killRequested'])
          def reconcile(raw_path):
              need(raw_path.is_file() and not raw_path.is_symlink() and 0 < raw_path.stat().st_size <= 2097152, 'NATIVE_REPORT_MISSING_OR_BOUND')
              raw = raw_path.read_bytes(); result = json.loads(raw); rows = []; seen = set(); reasons = []
              need(isinstance(result.get('testResults'), list) and len(result['testResults']) == 3, 'NATIVE_MODULE_COUNT')
