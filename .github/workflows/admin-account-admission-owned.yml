              counter_keys = ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests', 'numFailedTestSuites', 'numPendingTestSuites']
              need(all(type(result.get(k)) is int and 0 <= result[k] <= 4096 for k in counter_keys), 'NATIVE_COUNTER_SHAPE')
              counters = {k: result[k] for k in counter_keys}
              expected = {'numTotalTests': 63, 'numPassedTests': 63, 'numFailedTests': 0, 'numPendingTests': 0, 'numTodoTests': 0, 'numFailedTestSuites': 0, 'numPendingTestSuites': 0}
              if result.get('success') is not True or counters != expected or len(rows) != 63 or any(x['status'] != 'passed' or x['failureMessageCount'] != 0 for x in rows): reasons.append('NATIVE_NONPASS_OR_COUNTERS')
