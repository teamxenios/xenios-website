# Minimal CI: npm ci install, test, typecheck, build. No secrets, no deploy.
name: checks

on:
  pull_request:
  push:
    branches: [main, release/early-access-code-session-checkout]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - name: Outbox clock and real catalog-search qualification
        run: >-
          npx --no-install vitest run
          server/research/outbox.test.ts
          server/research/assisted-order/request-intent/catalog.test.ts
          server/research/master-offerings/request-intent-form-search.test.ts
          server/research/master-offerings/catalog-boundaries.test.ts
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      # A new component must qualify before an unrelated database gate can fail.
      # Conditional only on whether this source feature exists in the PR tree.
      - name: Staff review control source qualification
        if: ${{ hashFiles('client/src/research/assisted-order/StaffStartReviewControl.test.tsx') != '' }}
        run: >-
          npx --no-install vitest run
          client/src/research/assisted-order/StaffStartReviewControl.test.tsx
          client/src/care/api.test.ts
          client/src/care/CareRequestIntentPage.test.tsx
          client/src/research/assisted-order/request-intent-api.test.ts
          client/src/research/assisted-order/RequestWorkflowStatus.test.tsx
          client/src/research/assisted-order/RequestIntentStaffReadback.test.tsx
          client/src/research/pages/staff-sign-in-provider.test.tsx
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - name: Public offering and homepage source qualification
        run: >-
          npx --no-install vitest run
          client/src/home/HomeNext.test.tsx
          client/src/home/home-css.test.ts
          server/static.test.ts
          server/research/seo/raw-http-document-policy.test.ts
          server/core-site-protection.test.ts
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - name: FAQ and quality source qualification
        if: ${{ hashFiles('client/src/research/pages/Faq.test.tsx') != '' }}
        run: >-
          npx --no-install vitest run
          client/src/research/pages/Faq.test.tsx
          client/src/research/pages/quality-surfaces.test.tsx
          client/src/research/pages/public-brand-pages.test.tsx
          client/src/research/pages/care-research-postlaunch-conservation.test.tsx
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      # Qualify the real additive workflow before the release census can claim
      # replay evidence. The fixture owns a disposable PostgreSQL 16 database;
      # it accepts no managed database URL or provider credentials.
      - name: Request workflow PostgreSQL qualification
        if: ${{ hashFiles('server/research/assisted-order/request-intent/workflow/contract.pg.test.ts') != '' }}
        run: npx --no-install vitest run server/research/assisted-order/request-intent/workflow/contract.pg.test.ts --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - name: Customer notice PostgreSQL qualification
        if: ${{ hashFiles('server/research/assisted-order/request-intent/customer-notice.pg.test.ts') != '' }}
        run: npx --no-install vitest run server/research/assisted-order/request-intent/customer-notice.pg.test.ts --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      # Run the new receipt tests before the census requires replay evidence.
      # This never substitutes a declared replay flag for actual execution.
      - name: Customer notice receipt source and PostgreSQL qualification
        if: ${{ hashFiles('server/research/assisted-order/request-intent/customer-notice-receipts.pg.test.ts') != '' }}
        run: >-
          npx --no-install vitest run
          server/research/email/resend-webhook-signature.test.ts
          server/research/assisted-order/quote/delivery/signed-receipts.test.ts
          server/research/assisted-order/request-intent/customer-notice-receipts.test.ts
          server/research/assisted-order/request-intent/customer-notice-receipts.pg.test.ts
          server/research/assisted-order/request-intent/customer-notice-delivery-state.pg.test.ts
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - name: Staff recovery SQL and account-flow qualification
        if: ${{ hashFiles('server/research/staff-recovery.test.ts') != '' }}
        run: >-
          npx --no-install vitest run
          server/research/staff-recovery.test.ts
          server/research/members.test.ts
          client/src/research/pages/reset-password-continuity.test.tsx
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - name: Focused guest-entry regression checks
        # These existing workflow/price-exposure suites caught actual integration
        # failures. Run them before the full suite so feedback stays bounded.
        run: >-
          npx --no-install vitest run
          client/src/research/early-access/EarlyAccessRoute.logout.test.tsx
          client/src/research/early-access/EarlyAccessRoute.storefront.test.tsx
          server/research/assisted-order/request-intent/composition.integration.test.ts
          server/release-control-plane.test.ts
          server/research/early-access/quote-only-exposure-sweep.test.ts
          server/research/assisted-order/request-intent/workflow/access.test.ts
          server/research/assisted-order/request-intent/workflow/config.test.ts
          server/research/assisted-order/request-intent/workflow/routes.test.ts
          --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - run: npx vitest run
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: npm run build
  # QA R10: BOTH protection checks run in CI. The vitest job already includes
  # core-site-protection.test.ts (the hard-fail seam gate); this job runs the
  # standalone verifier and the route-uniqueness census as their own gate, so
  # a candidate cannot merge with either drifted.
  protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
      - run: npm ci
      - run: node scripts/acceptance/verify-core-site-protection.mjs "$BASE_REF" HEAD
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run verify:route-uniqueness
  # The existing cockpit checks its Windows Node/npm distribution layout.
  # Its real target must qualify without weakening the compatibility guard.
  factory-node:
    name: Factory assurance Node (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      # All four suites use Node built-ins; no repository dependency install.
      - name: Factory assurance and cockpit Node qualification
        run: >-
          node --test --test-concurrency=1
          scripts/agentic/factory-assurance/factory-assurance.node-test.mjs
          scripts/agentic/factory-assurance/factory-cli.node-test.mjs
          scripts/xenios-control/assurance.node-test.mjs
          scripts/xenios-control/control.test.mjs
  # Required jobs must finish successfully; a skipped job is not acceptance.
  # This checks job conclusions only, not skipped test cases or release readiness.
  required-checks:
    name: Required CI completion
    if: ${{ always() }}
    needs: [test, typecheck, build, protection, factory-node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unsuccessful or missing required jobs
        shell: bash
        env:
          FACTORY_RESULT: ${{ needs.factory-node.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PROTECTION_RESULT: ${{ needs.protection.result }}
        run: |
          set -euo pipefail
          for result in "$TEST_RESULT" "$TYPECHECK_RESULT" "$BUILD_RESULT" "$PROTECTION_RESULT" "$FACTORY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
          echo "All five required execution jobs succeeded."
