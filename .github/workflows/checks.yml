# Minimal CI: npm ci install, test, typecheck, build. No secrets, no deploy.
name: checks

on:
  pull_request:
  push:
    branches: [main, release/early-access-code-session-checkout]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Focused guest-entry regression checks
        run: npx --no-install vitest run client/src/research/early-access/EarlyAccessRoute.logout.test.tsx client/src/research/early-access/EarlyAccessRoute.storefront.test.tsx server/research/assisted-order/request-intent/composition.integration.test.ts server/release-control-plane.test.ts --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0
      - run: npx vitest run
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
  # QA R10: BOTH protection checks run in CI. The vitest job already includes
  # core-site-protection.test.ts (the hard-fail seam gate); this job runs the
  # standalone verifier and the route-uniqueness census as their own gate, so
  # a candidate cannot merge with either drifted.
  protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node scripts/acceptance/verify-core-site-protection.mjs "$BASE_REF" HEAD
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run verify:route-uniqueness
  # Required jobs must finish successfully; a skipped job is not acceptance.
  # This checks job conclusions only, not skipped test cases or release readiness.
  required-checks:
    name: Required CI completion
    if: ${{ always() }}
    needs: [test, typecheck, build, protection]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Refuse unsuccessful or missing required jobs
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PROTECTION_RESULT: ${{ needs.protection.result }}
        run: |
          set -euo pipefail
          for result in "$TEST_RESULT" "$TYPECHECK_RESULT" "$BUILD_RESULT" "$PROTECTION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
          echo "All four required CI jobs succeeded."
