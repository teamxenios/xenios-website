          const sdkPins=[{"path":"node_modules/@supabase/auth-js/package.json","bytes":1581,"sha256":"99154f06ba0b922c75a3279002537125b242cc8d4291b985d317badcc98b3899"},{"path":"node_modules/@supabase/auth-js/src/GoTrueAdminApi.ts","bytes":39212,"sha256":"8bded097c5c036622635fa16063af6b2761722cd7f7fee9fc22fd0c765ee2039"},{"path":"node_modules/@supabase/auth-js/src/lib/types.ts","bytes":93390,"sha256":"acd3bc4acac904036126666eca8ff63e758d8cc6e38e5d8204831b46299cdc8b"},{"path":"node_modules/@supabase/auth-js/src/lib/errors.ts","bytes":10671,"sha256":"0dc4af60f8957bc2d4fc0594b2199032694b5783c26b000e4d1321663b759882"}];
          for(const pin of sdkPins){const raw=fs.readFileSync(pin.path);assert.equal(raw.length,pin.bytes);assert.equal(crypto.createHash('sha256').update(raw).digest('hex'),pin.sha256);}
          fs.writeFileSync(process.env.REPORT_DIR+'/runtime-versions.json',JSON.stringify({node:process.version,npm:'10.8.2',lockedPackages:expected,verifiedSdkRawPins:sdkPins})+'\n');
          JS
      - name: Typecheck all twelve strict U3 source/test roots and ordinary imports
        id: typecheck
        timeout-minutes: 3
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path.cwd().resolve();reports=Path(os.environ['REPORT_DIR'])
          files=["client/src/research/pages/adminx/Accounts.test.tsx","client/src/research/pages/adminx/Accounts.tsx","server/research/admin-accounts/authority.test.ts","server/research/admin-accounts/authority.ts","server/research/admin-accounts/production.test.ts","server/research/admin-accounts/production.ts","server/research/admin-accounts/routes.test.ts","server/research/admin-accounts/routes.ts","server/research/admin-accounts/service.test.ts","server/research/admin-accounts/service.ts","shared/research/admin-accounts.test.ts","shared/research/admin-accounts.ts"]
          config={'extends':str(root/'tsconfig.json'),'files':[str(root/f) for f in files],'include':[],'exclude':[],'compilerOptions':{'incremental':False,'noEmit':True,'strict':True,'resolveJsonModule':True,'types':['node','vite/client','vitest/globals'],'typeRoots':[str(root/'node_modules/@types'),str(root/'node_modules')]}}
          with (reports/'focused-tsconfig.json').open('x') as f:json.dump(config,f,indent=2);f.write('\n')
          PY
          set +e
          node node_modules/typescript/bin/tsc --project "$REPORT_DIR/focused-tsconfig.json"
          result=$?
          set -e
          python3 - "$result" <<'PY'
          import json,os,sys
          from pathlib import Path
          code=int(sys.argv[1]);(Path(os.environ['REPORT_DIR'])/'typecheck.json').write_text(json.dumps({'scope':'EXACT_TWELVE_U3_SOURCE_TEST_ROOTS_AND_TRANSITIVE_IMPORTS_NOT_FULL_PROJECT','exitCode':code,'result':'PASS' if code==0 else 'FAIL'})+'\n')
          PY
          exit "$result"
      - name: Execute only six owned U3 account read suites
        id: tests
        timeout-minutes: 4
        shell: bash
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            client/src/research/pages/adminx/Accounts.test.tsx \
            server/research/admin-accounts/authority.test.ts \
            server/research/admin-accounts/production.test.ts \
            server/research/admin-accounts/routes.test.ts \
            server/research/admin-accounts/service.test.ts \
            shared/research/admin-accounts.test.ts \
            --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0 \
            --reporter=default --reporter=json --outputFile.json="$REPORT_DIR/vitest-results.json"
      - name: Reconcile exact expanded52 U3 names and zero failed skipped todo
        id: reconcile
        if: ${{ always() && steps.source_guard.outputs.report_dir != '' }}
        timeout-minutes: 1
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          from pathlib import Path
          from collections import Counter
          root = Path.cwd().resolve()
          reports = Path(os.environ['REPORT_DIR'])
          p = reports/'vitest-results.json'
          assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size <= 1048576
          result = json.loads(p.read_bytes())
          expected = json.loads((reports/'expected-tests.json').read_bytes())
          assert os.environ['DEPENDENCIES_OUTCOME']==os.environ['TYPECHECK_OUTCOME']==os.environ['TEST_OUTCOME']=='success'
          assert result['success'] is True
          for key, want in {'numTotalTests':expected['expectedCount'],'numPassedTests':expected['expectedCount'],'numFailedTests':0,'numPendingTests':0,'numTodoTests':0,'numFailedTestSuites':0,'numPendingTestSuites':0}.items():
              assert result[key] == want, (key, result[key], want)
          assert len(result['testResults']) == 6
          wanted = {f['path']:f for f in expected['files']}
          seen = set()
          counts = []
          for module in result['testResults']:
              path = Path(module['name']).resolve()
              relative = path.relative_to(root).as_posix()
              assert relative in wanted and relative not in seen
              seen.add(relative)
              assert module['status'] == 'passed' and module.get('message','') == ''
              cases = module['assertionResults']
              target = wanted[relative]
              assert len(cases) == target['expectedCount']
              actual_names = []
              for case in cases:
                  assert case['status'] == 'passed' and case.get('failureMessages',[]) == []
                  ancestors = list(case['ancestorTitles'])
                  # Exact source ancestor depth with only a known optional file-root.
                  wanted_names={(tuple(t['ancestorTitles']),t['title']) for t in target['tests']}
                  if (tuple(ancestors),case['title']) not in wanted_names:
                      assert ancestors and ancestors[0] in {'',relative,Path(relative).name,str(path)}
                      ancestors=ancestors[1:]
                  assert case['fullName'] == ' '.join(case['ancestorTitles'] + [case['title']])
                  actual_names.append((tuple(ancestors),case['title']))
              expected_names = [(tuple(case['ancestorTitles']),case['title']) for case in target['tests']]
              assert Counter(actual_names) == Counter(expected_names), relative
              counts.append({'path':relative,'passed':len(cases),'failed':0,'skipped':0,'todo':0})
          assert seen == set(wanted)
          assert not subprocess.check_output(['git','--no-optional-locks','status','--porcelain','--untracked-files=all']).strip()
          (reports/'reconciled-results.json').write_text(json.dumps({'source':expected['source'],'tree':expected['tree'],'run':os.environ['GITHUB_RUN_ID'],'attempt':1,'runner':json.loads((reports/'source-guard.json').read_bytes())['runner'],'result':'PASS_EXACT52_U3_SYNTHETIC_READ_CASES_ONLY','executedPassed':expected['expectedCount'],'failed':0,'skipped':0,'todo':0,'files':counts,'scope':'SYNTHETIC_U3_READ_PREREQUISITE_NOT_MANAGED_ACCOUNT_ACCESS_OR_MOUNT_OR_POLICY_ACTIVATION'},indent=2)+'\n')
          PY
      - name: Bound owned report inventory before upload
        id: report_bound
        if: ${{ always() && steps.source_guard.outputs.report_dir != '' }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root = Path(os.environ['REPORT_DIR'])
          assert root.is_dir() and not root.is_symlink()
          proof=json.loads((root/'source-guard.json').read_bytes());st=root.lstat();assert st.st_dev==proof['outputOwner']['dev'] and st.st_ino==proof['outputOwner']['ino']
          allowed = {'focused-tsconfig.json','source-guard.json','expected-tests.json','runtime-versions.json','typecheck.json','vitest-results.json','reconciled-results.json'}
          files = list(root.iterdir())
          assert 1 <= len(files) <= len(allowed)
          total = 0
          for p in files:
              assert p.name in allowed and p.is_file() and not p.is_symlink()
              assert 0 < p.stat().st_size <= 1048576
              total += p.stat().st_size
          assert total <= 2097152
          print('Owned report inventory is bounded:',len(files),'files,',total,'bytes')
          PY
      - name: Preserve bounded owned U3 qualification reports only
        if: ${{ always() && steps.source_guard.outputs.report_dir != '' && steps.report_bound.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: u3-admin-account-read-owned-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.source_guard.outputs.report_dir }}/*.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
