          for module in result['testResults']:
              path = Path(module['name']).resolve()
              relative = path.relative_to(root).as_posix()
              assert relative in wanted and relative not in seen
              seen.add(relative)
              assert module['status'] == 'passed' and module.get('message','') == ''
              cases = module['assertionResults']
              target = wanted[relative]
              assert len(cases) == target['expectedCount']
              actual_names = []
              for case in cases:
                  assert case['status'] == 'passed' and case.get('failureMessages',[]) == []
                  ancestors = list(case['ancestorTitles'])
                  # The JSON reporter may retain its exact file-root ancestor. No arbitrary
                  # suite prefix is accepted; source describe/title inventory stays exact.
                  if len(ancestors) == 2:
                      assert ancestors[0] in {'', relative, Path(relative).name, str(path)}
                      ancestors = ancestors[1:]
                  assert len(ancestors) == 1
                  assert case['fullName'] == ' '.join(case['ancestorTitles'] + [case['title']])
                  actual_names.append((tuple(ancestors),case['title']))
              expected_names = [(tuple(case['ancestorTitles']),case['title']) for case in target['tests']]
              assert Counter(actual_names) == Counter(expected_names), relative
              counts.append({'path':relative,'passed':len(cases),'failed':0,'skipped':0,'todo':0})
          assert seen == set(wanted)
          assert not subprocess.check_output(['git','--no-optional-locks','status','--porcelain','--untracked-files=all']).strip()
          (reports/'reconciled-results.json').write_text(json.dumps({'source':expected['source'],'tree':expected['tree'],'run':os.environ['GITHUB_RUN_ID'],'attempt':1,'result':'PASS_EXACT_59_DISCOVERY_CASES_ONLY','baseline':50,'added':9,'executedPassed':59,'failed':0,'skipped':0,'todo':0,'files':counts,'scope':'SYNTHETIC_SOURCE_QUALIFICATION_NOT_PRODUCT_PRIVACY_CLINICAL_OR_RUNTIME_ACTIVATION'},indent=2)+'\n')
          PY
      - name: Bound owned report inventory before upload
        id: report_bound
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['REPORT_DIR'])
          assert root.is_dir() and not root.is_symlink()
          allowed = {'source-guard.json','expected-tests.json','runtime-versions.json','typecheck.json','vitest-results.json','reconciled-results.json'}
          files = list(root.iterdir())
          assert 1 <= len(files) <= len(allowed)
          total = 0
          for p in files:
              assert p.name in allowed and p.is_file() and not p.is_symlink()
              assert 0 < p.stat().st_size <= 1048576
              total += p.stat().st_size
          assert total <= 2097152
          print('Owned report inventory is bounded:',len(files),'files,',total,'bytes')
          PY
      - name: Preserve bounded owned discovery reports only
        if: ${{ always() && steps.report_bound.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: c2-discovery-9002-owned-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c2-discovery-9002-owned/*.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
