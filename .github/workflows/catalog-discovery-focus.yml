      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact locked dependencies and verify runtime versions
        id: dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          node -e 'const assert=require("node:assert/strict");assert.equal(process.version,"v20.19.0")'
          test "$(npm --version)" = '10.8.2'
          npm ci --no-audit --no-fund
          node - <<'JS'
          const fs=require('node:fs');const assert=require('node:assert/strict');
          const expected={"vitest": "4.1.10", "@vitest/runner": "4.1.10", "@vitest/utils": "4.1.10", "typescript": "5.6.3"};
          for(const [name,version] of Object.entries(expected))assert.equal(JSON.parse(fs.readFileSync('node_modules/'+name+'/package.json','utf8')).version,version);
          fs.writeFileSync(process.env.REPORT_DIR+'/runtime-versions.json',JSON.stringify({node:process.version,npm:'10.8.2',lockedPackages:expected})+'\n');
          JS
      - name: Typecheck only discovery contract, fixture, producer and selected tests
        id: typecheck
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types node,vitest/globals \
            shared/research/assisted-order/discovery/contract.ts \
            shared/research/assisted-order/discovery/evaluate.ts \
            shared/research/assisted-order/discovery/validate-manifest.ts \
            shared/research/assisted-order/discovery/__fixtures__/slice-manifest.ts \
            shared/research/assisted-order/discovery/evaluate.test.ts \
            shared/research/assisted-order/discovery/validate-manifest.test.ts
          result=$?
          set -e
          python3 - "$result" <<'PY'
          import json,os,sys
          from pathlib import Path
          code=int(sys.argv[1]);(Path(os.environ['REPORT_DIR'])/'typecheck.json').write_text(json.dumps({'scope':'EXACT_SIX_DISCOVERY_TYPES_FIXTURE_AND_TEST_FILES','exitCode':code,'result':'PASS' if code==0 else 'FAIL'})+'\n')
          PY
          exit "$result"
      - name: Execute only the two owned discovery suites
        id: tests
        timeout-minutes: 4
        shell: bash
        run: |
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts \
            shared/research/assisted-order/discovery/evaluate.test.ts \
            shared/research/assisted-order/discovery/validate-manifest.test.ts \
            --maxWorkers=1 --no-file-parallelism --allowOnly=false --retry=0 \
            --reporter=default --reporter=json --outputFile.json="$REPORT_DIR/vitest-results.json"
      - name: Reconcile actual exact59 names and zero failed skipped todo
        id: reconcile
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, subprocess
          from pathlib import Path
          from collections import Counter
          root = Path.cwd().resolve()
          reports = Path(os.environ['REPORT_DIR'])
          p = reports/'vitest-results.json'
          assert p.is_file() and not p.is_symlink() and 0 < p.stat().st_size <= 1048576
          result = json.loads(p.read_bytes())
          expected = json.loads((reports/'expected-tests.json').read_bytes())
          assert result['success'] is True
          for key, want in {'numTotalTests':59,'numPassedTests':59,'numFailedTests':0,'numPendingTests':0,'numTodoTests':0,'numFailedTestSuites':0,'numPendingTestSuites':0}.items():
