<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xenios — offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #000; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { text-align: center; padding: 2rem; max-width: 26rem; }
      h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; color: #a1a1aa; line-height: 1.6; font-size: 0.95rem; }
      button {
        appearance: none; border: 1px solid #3f3f46; border-radius: 9999px;
        background: transparent; color: #fff; padding: 0.6rem 1.5rem;
        font-size: 0.9rem; cursor: pointer;
      }
      button:hover { border-color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>xenios</h1>
      <p>You are offline. Your account, catalog, and orders need a connection —
         nothing private is stored on this device.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
